[package]
name = "panamax-search"
version = "0.2.2"
edition = "2021"
description = "Search crates in a panamax mirror like `cargo search`"
repository = "https://github.com/qtfkwk/panamax-search"
license = "MIT"

[dependencies]
panamax-search-lib = { version = "0.2.2", path = "../lib" }
anyhow = "1.0.96"
clap = { version = "4.5.30", features = ["derive", "wrap_help"] }
env_logger = "0.11.6"
expanduser = "1.2.2"
log = "0.4.26"
clap-cargo = "0.15.2"
