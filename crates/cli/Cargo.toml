[package]
name = "panamax-search"
version = "0.3.4"
edition = "2024"
description = "Search crates in a panamax mirror like `cargo search`"
repository = "https://github.com/qtfkwk/panamax-search"
license = "MIT"

[dependencies]
anyhow = "1.0.102"
clap-cargo = "0.18.3"
clap = { version = "4.5.60", features = ["derive", "wrap_help"] }
env_logger = "0.11.9"
expanduser = "1.2.2"
log = "0.4.29"
panamax-search-lib = { version = "0.3.4", path = "../lib" }
