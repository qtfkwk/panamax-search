[package]
name = "panamax-search"
version = "0.3.0"
edition = "2024"
description = "Search crates in a panamax mirror like `cargo search`"
repository = "https://github.com/qtfkwk/panamax-search"
license = "MIT"

[dependencies]
panamax-search-lib = { version = "0.3.0", path = "../lib" }
anyhow = "1.0.99"
clap = { version = "4.5.46", features = ["derive", "wrap_help"] }
env_logger = "0.11.8"
expanduser = "1.2.2"
log = "0.4.27"
clap-cargo = "0.17.0"
