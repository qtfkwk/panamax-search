[package]
name = "panamax-search"
version = "0.3.2"
edition = "2024"
description = "Search crates in a panamax mirror like `cargo search`"
repository = "https://github.com/qtfkwk/panamax-search"
license = "MIT"

[dependencies]
anyhow = "1.0.100"
clap-cargo = "0.18.3"
clap = { version = "4.5.51", features = ["derive", "wrap_help"] }
env_logger = "0.11.8"
expanduser = "1.2.2"
log = "0.4.28"
panamax-search-lib = { version = "0.3.2", path = "../lib" }
