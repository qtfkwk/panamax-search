[package]
name = "panamax-search-lib"
version = "0.3.5"
edition = "2024"
description = "Search crates in a panamax mirror like `cargo search`"
repository = "https://github.com/qtfkwk/panamax-search"
license = "MIT"

[dependencies]
anyhow = "1.0.102"
flate2 = "1.1.9"
log = "0.4.29"
owo-colors = "4.3.0"
rayon = "1.12.0"
regex = "1.12.3"
rev_lines = "0.3.0"
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tar = "0.4.45"
toml = { version = "1.1.2", features = ["parse"] }
walkdir = "2.5.0"
