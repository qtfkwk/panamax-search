[package]
name = "panamax-search-lib"
version = "0.2.3"
edition = "2021"
description = "Search crates in a panamax mirror like `cargo search`"
repository = "https://github.com/qtfkwk/panamax-search"
license = "MIT"

[dependencies]
anyhow = "1.0.98"
flate2 = "1.1.1"
log = "0.4.27"
owo-colors = "4.2.0"
rayon = "1.10.0"
regex = "1.11.1"
rev_lines = "0.3.0"
semver = { version = "1.0.26", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tar = "0.4.44"
toml = { version = "0.8.20", features = ["parse"] }
walkdir = "2.5.0"
